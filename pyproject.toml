[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uaft"
version = "0.2.0"
description = "Universal Automation Framework Tool"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Anonmaly", email = "anonmaly@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/anonmaly/uaft"
Repository = "https://github.com/anonmaly/uaft"
Issues = "https://github.com/anonmaly/uaft/issues"

[project.scripts]
uaft = "uaft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
